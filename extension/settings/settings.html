<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="settings_title"></title>
  <link rel="icon" href="../icons/mantis.svg">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <header>
    <img src="../icons/mantis.svg" alt="" width="40" height="40">
    <div>
      <h1 data-i18n="settings_title"></h1>
      <p id="version" class="hint"></p>
    </div>
  </header>

  <section>
    <h2 data-i18n="settings_browsing"></h2>

    <label class="option">
      <span>
        <b data-i18n="settings_pip"></b>
        <span class="hint" data-i18n="settings_pipHint"></span>
      </span>
      <input type="checkbox" class="switch" data-pref="media.videocontrols.picture-in-picture.enable-when-switching-tabs.enabled">
    </label>

    <label class="option">
      <span>
        <b data-i18n="settings_autoplay"></b>
        <span class="hint" data-i18n="settings_autoplayHint"></span>
      </span>
      <select data-pref="media.autoplay.default">
        <option value="1" data-i18n="settings_autoplayBlockAudible"></option>
        <option value="5" data-i18n="settings_autoplayBlockAll"></option>
        <option value="0" data-i18n="settings_autoplayAllow"></option>
      </select>
    </label>

    <label class="option">
      <span>
        <b data-i18n="settings_smoothScroll"></b>
        <span class="hint" data-i18n="settings_smoothScrollHint"></span>
      </span>
      <input type="checkbox" class="switch" data-pref="general.smoothScroll.msdPhysics.enabled">
    </label>

    <label class="option">
      <span>
        <b data-i18n="settings_tabSleep"></b>
        <span class="hint" data-i18n="settings_tabSleepHint"></span>
      </span>
      <select id="tab-sleep-minutes" data-i18n-aria-label="settings_tabSleepAfter">
        <option value="15" data-i18n="settings_tabSleep15"></option>
        <option value="30" data-i18n="settings_tabSleep30"></option>
        <option value="60" data-i18n="settings_tabSleep60"></option>
        <option value="120" data-i18n="settings_tabSleep120"></option>
        <option value="240" data-i18n="settings_tabSleep240"></option>
      </select>
      <input type="checkbox" class="switch" data-store="tabSleep">
    </label>

    <div class="option column" id="tab-sleep-exceptions-row">
      <label for="tab-sleep-exceptions">
        <b data-i18n="settings_tabSleepExceptions"></b>
        <span class="hint" data-i18n="settings_tabSleepExceptionsHint"></span>
      </label>
      <textarea id="tab-sleep-exceptions" rows="2" spellcheck="false"></textarea>
    </div>
  </section>

  <section id="performance">
    <h2 data-i18n="settings_performance"></h2>

    <div class="option">
      <span>
        <b data-i18n="settings_perfUsage"></b>
        <span class="hint" id="perf-usage" role="status" data-i18n="settings_perfMeasuring"></span>
        <span class="hint" id="perf-minimize-status" role="status"></span>
      </span>
      <button type="button" class="secondary" id="perf-minimize" data-i18n="settings_minimize"
              data-i18n-title="settings_minimizeHint"></button>
    </div>

    <div class="option column">
      <span>
        <b data-i18n="settings_hotTabs"></b>
        <span class="hint" data-i18n="settings_hotTabsHint"></span>
      </span>
      <ol class="hot-tabs" id="hot-tabs"></ol>
      <span class="hint" id="hot-tabs-empty" hidden data-i18n="settings_hotTabsEmpty"></span>
      <span class="hot-tabs-actions">
        <button type="button" class="secondary" id="sleep-background" data-i18n="settings_sleepBackground"></button>
        <span class="hint" id="sleep-background-status" role="status"></span>
      </span>
    </div>

    <label class="option">
      <span>
        <b data-i18n="settings_eco"></b>
        <span class="hint" data-i18n="settings_ecoHint"></span>
        <span class="hint" id="eco-state" role="status"></span>
      </span>
      <select id="eco-mode" data-i18n-aria-label="settings_eco">
        <option value="off" data-i18n="settings_ecoOff"></option>
        <option value="battery" data-i18n="settings_ecoBattery"></option>
        <option value="on" data-i18n="settings_ecoOn"></option>
      </select>
    </label>

    <label class="option">
      <span>
        <b data-i18n="settings_ramLimit"></b>
        <span class="hint" data-i18n="settings_ramLimitHint"></span>
      </span>
      <select data-store-number="ramLimitMB" data-i18n-aria-label="settings_ramLimit">
        <option value="2048">2 GB</option>
        <option value="3072">3 GB</option>
        <option value="4096">4 GB</option>
        <option value="6144">6 GB</option>
        <option value="8192">8 GB</option>
        <option value="12288">12 GB</option>
        <option value="16384">16 GB</option>
      </select>
      <input type="checkbox" class="switch" data-store="ramLimit">
    </label>

    <label class="option">
      <span>
        <b data-i18n="settings_cpuLimit"></b>
        <span class="hint" data-i18n="settings_cpuLimitHint"></span>
        <span class="hint warn" id="cpu-limit-failed" hidden data-i18n="settings_cpuLimitFailed"></span>
      </span>
      <select data-store-number="cpuLimitPercent" data-i18n-aria-label="settings_cpuLimit">
        <option value="20">20 %</option>
        <option value="30">30 %</option>
        <option value="40">40 %</option>
        <option value="50">50 %</option>
        <option value="60">60 %</option>
        <option value="75">75 %</option>
        <option value="90">90 %</option>
      </select>
      <input type="checkbox" class="switch" data-store="cpuLimit">
    </label>

    <label class="option">
      <span>
        <b data-i18n="settings_netLimit"></b>
        <span class="hint" data-i18n="settings_netLimitHint"></span>
      </span>
      <select data-store-number="netLimitKBps" data-i18n-aria-label="settings_netLimit">
        <option value="256">256 kB/s</option>
        <option value="512">512 kB/s</option>
        <option value="1024">1 MB/s</option>
        <option value="2048">2 MB/s</option>
        <option value="5120">5 MB/s</option>
        <option value="10240">10 MB/s</option>
        <option value="25600">25 MB/s</option>
        <option value="51200">50 MB/s</option>
      </select>
      <input type="checkbox" class="switch" data-store="netLimit">
    </label>
  </section>

  <section id="appearance">
    <h2 data-i18n="settings_appearance"></h2>

    <label class="option">
      <span>
        <b data-i18n="settings_theme"></b>
        <span class="hint" data-i18n="settings_themeHint"></span>
      </span>
      <select id="theme-preset" data-i18n-aria-label="settings_theme">
        <option value="mantis" data-i18n="settings_themeMantis"></option>
        <option value="night" data-i18n="settings_themeNight"></option>
        <option value="neon" data-i18n="settings_themeNeon"></option>
        <option value="synthwave" data-i18n="settings_themeSynthwave"></option>
        <option value="ocean" data-i18n="settings_themeOcean"></option>
        <option value="violet" data-i18n="settings_themeViolet"></option>
        <option value="sunset" data-i18n="settings_themeSunset"></option>
        <option value="day" data-i18n="settings_themeDay"></option>
        <option value="custom" data-i18n="settings_themeCustom"></option>
      </select>
    </label>

    <div class="option column" id="theme-custom-row" hidden>
      <span>
        <b data-i18n="settings_themeCustomColors"></b>
        <span class="hint" data-i18n="settings_themeCustomHint"></span>
      </span>
      <div class="colors">
        <label><input type="color" data-theme-color="frame"> <span data-i18n="settings_colorFrame"></span></label>
        <label><input type="color" data-theme-color="toolbar"> <span data-i18n="settings_colorToolbar"></span></label>
        <label><input type="color" data-theme-color="text"> <span data-i18n="settings_colorText"></span></label>
        <label><input type="color" data-theme-color="field"> <span data-i18n="settings_colorField"></span></label>
        <label><input type="color" data-theme-color="accent"> <span data-i18n="settings_colorAccent"></span></label>
      </div>
    </div>

    <label class="option">
      <span>
        <b data-i18n="settings_accent"></b>
        <span class="hint" data-i18n="settings_accentHint"></span>
      </span>
      <input type="color" id="theme-accent-color" data-i18n-aria-label="settings_accent">
      <input type="checkbox" class="switch" id="theme-accent-custom">
    </label>

    <label class="option">
      <span>
        <b data-i18n="settings_glow"></b>
        <span class="hint" data-i18n="settings_glowHint"></span>
      </span>
      <input type="checkbox" class="switch" id="theme-glow">
    </label>

    <label class="option" id="theme-glow-colors-row">
      <span>
        <b data-i18n="settings_glowColors"></b>
        <span class="hint" data-i18n="settings_glowColorsHint"></span>
      </span>
      <select id="theme-glow-colors" data-i18n-aria-label="settings_glowColors">
        <option value="background" data-i18n="settings_glowColorsBackground"></option>
        <option value="theme" data-i18n="settings_glowColorsTheme"></option>
      </select>
    </label>

    <label class="option">
      <span>
        <b data-i18n="settings_compactUrlbar"></b>
        <span class="hint" data-i18n="settings_compactUrlbarHint"></span>
      </span>
      <input type="checkbox" class="switch" data-pref="mantis.urlbar.compact">
    </label>
  </section>

  <section id="sounds">
    <h2 data-i18n="settings_sounds"></h2>

    <label class="option">
      <span>
        <b data-i18n="settings_soundTyping"></b>
        <span class="hint" data-i18n="settings_soundTypingHint"></span>
      </span>
      <input type="checkbox" class="switch" data-store="soundTyping">
    </label>

    <label class="option">
      <span><b data-i18n="settings_soundTabs"></b></span>
      <input type="checkbox" class="switch" data-store="soundTabs">
    </label>

    <label class="option">
      <span><b data-i18n="settings_soundVolume"></b></span>
      <input type="range" min="5" max="100" step="5" data-store-number="soundVolume" data-i18n-aria-label="settings_soundVolume">
    </label>

    <div class="option">
      <span>
        <b data-i18n="settings_soundPack"></b>
        <span class="hint" data-i18n="settings_soundPackHint"></span>
      </span>
      <select id="sound-pack" data-i18n-aria-label="settings_soundPack">
        <option value="soft" data-i18n="settings_soundPackSoft"></option>
        <option value="keyboard" data-i18n="settings_soundPackKeyboard"></option>
        <option value="typewriter" data-i18n="settings_soundPackTypewriter"></option>
        <option value="bubbles" data-i18n="settings_soundPackBubbles"></option>
        <option value="custom" data-i18n="settings_soundPackCustom"></option>
      </select>
      <button type="button" class="secondary" data-sound-preview="key" data-i18n="settings_soundPlay"></button>
    </div>

    <div class="option column" id="sound-custom-row" hidden>
      <span>
        <b data-i18n="settings_soundCustom"></b>
        <span class="hint" data-i18n="settings_soundCustomHint"></span>
      </span>
      <input type="file" id="sound-file" accept="audio/*" hidden>
      <div class="sound-list">
        <div class="sound-item" data-sound-kind="key">
          <span><b data-i18n="settings_soundKindKey"></b> <span class="hint" data-sound-state></span></span>
          <button type="button" class="secondary" data-sound-choose data-i18n="settings_soundChoose"></button>
          <button type="button" class="secondary" data-sound-preview="key" data-i18n="settings_soundPlay"></button>
          <button type="button" class="secondary" data-sound-remove data-i18n="settings_wallpaperRemove"></button>
        </div>
        <div class="sound-item" data-sound-kind="open">
          <span><b data-i18n="settings_soundKindOpen"></b> <span class="hint" data-sound-state></span></span>
          <button type="button" class="secondary" data-sound-choose data-i18n="settings_soundChoose"></button>
          <button type="button" class="secondary" data-sound-preview="open" data-i18n="settings_soundPlay"></button>
          <button type="button" class="secondary" data-sound-remove data-i18n="settings_wallpaperRemove"></button>
        </div>
        <div class="sound-item" data-sound-kind="close">
          <span><b data-i18n="settings_soundKindClose"></b> <span class="hint" data-sound-state></span></span>
          <button type="button" class="secondary" data-sound-choose data-i18n="settings_soundChoose"></button>
          <button type="button" class="secondary" data-sound-preview="close" data-i18n="settings_soundPlay"></button>
          <button type="button" class="secondary" data-sound-remove data-i18n="settings_wallpaperRemove"></button>
        </div>
      </div>
      <p class="hint" id="sound-custom-error" role="alert" hidden></p>
    </div>
  </section>

  <section id="mods">
    <h2 data-i18n="settings_mods"></h2>

    <div class="option column">
      <span>
        <b data-i18n="settings_modExport"></b>
        <span class="hint" data-i18n="settings_modExportHint"></span>
      </span>
      <div class="inline">
        <input type="text" id="mod-name" maxlength="60" data-i18n-placeholder="settings_modNamePlaceholder" data-i18n-aria-label="settings_modName">
        <button type="button" id="mod-export" data-i18n="settings_modExportButton"></button>
      </div>
      <label class="checkline"><input type="checkbox" id="mod-wallpaper"> <span data-i18n="settings_modIncludeWallpaper"></span></label>
    </div>

    <div class="option">
      <span>
        <b data-i18n="settings_modImport"></b>
        <span class="hint" id="mod-status" role="status" data-i18n="settings_modImportHint"></span>
      </span>
      <input type="file" id="mod-file" accept=".mantis-mod,application/json" hidden>
      <button type="button" id="mod-import" data-i18n="settings_modImportButton"></button>
    </div>
  </section>

  <section id="security">
    <h2 data-i18n="settings_security"></h2>

    <label class="option">
      <span>
        <b data-i18n="settings_webgl"></b>
        <span class="hint" data-i18n="settings_webglHint"></span>
      </span>
      <input type="checkbox" class="switch" data-pref="webgl.disabled" data-pref-invert>
    </label>
  </section>

  <section>
    <h2 data-i18n="settings_newtab"></h2>

    <label class="option">
      <span><b data-i18n="settings_clock"></b></span>
      <input type="checkbox" class="switch" data-store="newtabClock">
    </label>

    <label class="option">
      <span><b data-i18n="settings_newtabStats"></b>
        <span class="hint" data-i18n="settings_newtabStatsHint"></span></span>
      <input type="checkbox" class="switch" data-store="newtabStats">
    </label>

    <label class="option">
      <span><b data-i18n="settings_background"></b>
        <span class="hint" data-i18n="settings_backgroundHint"></span></span>
      <input type="checkbox" class="switch" data-store="newtabBackground">
    </label>

    <div class="option">
      <span><b data-i18n="settings_wallpaper"></b>
        <span class="hint" id="wallpaper-state" data-i18n="settings_wallpaperHint"></span></span>
      <input id="wallpaper-file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
      <button id="wallpaper-choose" type="button" data-i18n="settings_wallpaperChoose"></button>
      <button id="wallpaper-remove" type="button" data-i18n="settings_wallpaperRemove" hidden></button>
    </div>
  </section>

  <section>
    <h2 data-i18n="settings_privacy"></h2>

    <label class="option">
      <span>
        <b data-i18n="settings_blockNotifications"></b>
        <span class="hint" data-i18n="settings_blockNotificationsHint"></span>
      </span>
      <input type="checkbox" class="switch" data-pref="permissions.default.desktop-notification" data-pref-on="2" data-pref-off="0">
    </label>

    <label class="option">
      <span>
        <b data-i18n="settings_blockGeo"></b>
        <span class="hint" data-i18n="settings_blockGeoHint"></span>
      </span>
      <input type="checkbox" class="switch" data-pref="permissions.default.geo" data-pref-on="2" data-pref-off="0">
    </label>

    <div class="option column">
      <span>
        <b data-i18n="settings_forget"></b>
        <span class="hint" data-i18n-html="settings_forgetHint"></span>
      </span>
      <form id="forget" class="inline">
        <input id="forget-site" type="text" data-i18n-placeholder="settings_forgetPlaceholder"
               data-i18n-aria-label="settings_forgetLabel">
        <button type="submit" data-i18n="settings_forgetButton"></button>
      </form>
      <p id="forget-result" class="hint" role="status"></p>
    </div>
  </section>

  <section id="shopping">
    <h2 data-i18n="settings_shopping"></h2>

    <label class="option">
      <span>
        <b data-i18n="settings_eshopWarning"></b>
        <span class="hint" data-i18n="settings_eshopWarningHint"></span>
        <span class="hint" id="eshop-info"></span>
      </span>
      <input type="checkbox" class="switch" data-store="eshopWarning">
    </label>

    <label class="option">
      <span>
        <b data-i18n="settings_currency"></b>
        <span class="hint" data-i18n="settings_currencyHint"></span>
        <span class="hint" id="currency-info"></span>
      </span>
      <input type="checkbox" class="switch" data-store="currencyConvert">
    </label>
  </section>

  <section id="workspaces">
    <h2 data-i18n="settings_workspaces"></h2>

    <div class="option column">
      <span>
        <b data-i18n="settings_workspacesList"></b>
        <span class="hint" data-i18n-html="settings_workspacesHint"></span>
      </span>
      <ol class="ws-list" id="ws-list"></ol>
      <span class="hot-tabs-actions">
        <button type="button" class="secondary" id="ws-add" data-i18n="settings_wsAdd"></button>
      </span>
    </div>
  </section>

  <section id="sessions">
    <h2 data-i18n="settings_sessions"></h2>

    <div class="option column">
      <span>
        <b data-i18n="settings_sessionsList"></b>
        <span class="hint" data-i18n-html="settings_sessionsHint"></span>
      </span>
      <ol class="ws-list" id="sess-list"></ol>
      <span class="hint" id="sess-empty" hidden data-i18n="settings_sessionsEmpty"></span>
      <span class="hot-tabs-actions">
        <button type="button" class="secondary" id="sess-save" data-i18n="settings_sessSave"></button>
        <span class="hint" id="sess-status" role="status"></span>
      </span>
    </div>
  </section>

  <section id="messengers">
    <h2 data-i18n="settings_messengers"></h2>

    <div class="option column">
      <span>
        <b data-i18n="settings_messengersList"></b>
        <span class="hint" data-i18n-html="settings_messengersHint"></span>
      </span>
      <div class="colors" id="messenger-list"></div>
    </div>

    <label class="option">
      <span>
        <b data-i18n="settings_sidebarRail"></b>
        <span class="hint" data-i18n="settings_sidebarRailHint"></span>
      </span>
      <input type="checkbox" class="switch" data-store="sidebarRail">
    </label>
  </section>

  <section id="tools">
    <h2 data-i18n="settings_tools"></h2>

    <label class="option">
      <span>
        <b data-i18n="settings_toolUnaccent"></b>
        <span class="hint" data-i18n-html="settings_toolUnaccentHint"></span>
      </span>
      <input type="checkbox" class="switch" data-store="toolUnaccent">
    </label>

    <label class="option">
      <span>
        <b data-i18n="settings_toolSaveImage"></b>
        <span class="hint" data-i18n="settings_toolSaveImageHint"></span>
      </span>
      <input type="checkbox" class="switch" data-store="toolSaveImage">
    </label>

    <label class="option">
      <span>
        <b data-i18n="settings_toolPrintEdit"></b>
        <span class="hint" data-i18n-html="settings_toolPrintEditHint"></span>
      </span>
      <input type="checkbox" class="switch" data-store="toolPrintEdit">
    </label>
  </section>

  <section id="other-browser">
    <h2 data-i18n="settings_otherBrowser"></h2>

    <label class="option">
      <span>
        <b data-i18n="settings_otherOpenIn"></b>
        <span class="hint" data-i18n="settings_otherOpenInHint"></span>
      </span>
      <select id="other-browser-select"></select>
    </label>

    <div class="option column">
      <label for="other-browser-sites">
        <b data-i18n="settings_otherSites"></b>
        <span class="hint" data-i18n="settings_otherSitesHint"></span>
      </label>
      <textarea id="other-browser-sites" rows="3" spellcheck="false"></textarea>
    </div>

    <label class="option">
      <span>
        <b data-i18n="settings_otherNotify"></b>
        <span class="hint" data-i18n="settings_otherNotifyHint"></span>
      </span>
      <input type="checkbox" class="switch" id="other-browser-notify">
    </label>
  </section>

  <section id="doh">
    <h2 data-i18n="settings_doh"></h2>

    <label class="option">
      <span>
        <b data-i18n="settings_dohMode"></b>
        <span class="hint" data-i18n-html="settings_dohModeHint"></span>
      </span>
      <select data-doh="mode">
        <option value="off" data-i18n="common_off"></option>
        <option value="auto" data-i18n="settings_dohAuto"></option>
        <option value="on" data-i18n="settings_dohAlways"></option>
      </select>
    </label>

    <label class="option">
      <span>
        <b data-i18n="settings_dohProvider"></b>
        <span class="hint" data-i18n="settings_dohProviderHint"></span>
      </span>
      <select data-doh="provider">
        <option value="quad9">Quad9</option>
        <option value="mullvad">Mullvad</option>
        <option value="mullvad-adblock" data-i18n="doh_provider_mullvadAdblock"></option>
        <option value="cloudflare">Cloudflare</option>
      </select>
    </label>

    <div class="option">
      <span>
        <b data-i18n="settings_dohState"></b>
        <span class="hint" id="doh-state" role="status" data-i18n="settings_checking"></span>
      </span>
      <button id="doh-check" type="button" data-i18n="settings_dohCheck"></button>
    </div>
  </section>

  <section id="sensitive">
    <h2 data-i18n="settings_sensitive"></h2>

    <label class="option">
      <span>
        <b data-i18n="settings_sensitiveEnabled"></b>
        <span class="hint" data-i18n-html="settings_sensitiveEnabledHint"></span>
      </span>
      <input type="checkbox" class="switch" data-sensitive="enabled">
    </label>

    <label class="option">
      <span>
        <b data-i18n="settings_sensitiveAdult"></b>
        <span class="hint" data-i18n-html="settings_sensitiveAdultHint"></span>
      </span>
      <input type="checkbox" class="switch" data-sensitive="adult">
    </label>

    <div class="option column">
      <label for="sensitive-custom">
        <b data-i18n="settings_sensitiveCustom"></b>
        <span class="hint" data-i18n-html="settings_sensitiveCustomHint"></span>
      </label>
      <textarea id="sensitive-custom" data-sensitive-list="custom" rows="4" spellcheck="false"></textarea>
    </div>

    <div class="option column">
      <label for="sensitive-exceptions">
        <b data-i18n="settings_sensitiveExceptions"></b>
        <span class="hint" data-i18n="settings_sensitiveExceptionsHint"></span>
      </label>
      <textarea id="sensitive-exceptions" data-sensitive-list="exceptions" rows="3" spellcheck="false"></textarea>
    </div>

    <div class="option">
      <span>
        <b data-i18n="settings_sensitiveClean"></b>
        <span class="hint" id="sensitive-result" role="status" data-i18n="settings_sensitiveCleanHint"></span>
      </span>
      <button id="sensitive-clean" type="button" data-i18n="settings_sensitiveCleanButton"></button>
    </div>

    <p class="hint note" data-i18n-html="settings_sensitiveNote"></p>
  </section>

  <section>
    <h2 data-i18n="settings_extensions"></h2>
    <div class="option">
      <span>
        <b data-i18n="settings_recommended"></b>
        <span class="hint" data-i18n="settings_recommendedHint"></span>
      </span>
      <a class="button" href="../welcome/welcome.html" data-i18n="common_open"></a>
    </div>
  </section>

  <section>
    <h2 data-i18n="settings_updates"></h2>

    <div class="option">
      <span>
        <b data-i18n="settings_updatesMantis"></b>
        <span class="hint" id="update-status" data-i18n="settings_updatesMantisHint"></span>
      </span>
      <button id="update-install" type="button" hidden data-i18n="settings_install"></button>
      <a class="button" href="https://moneyas.cz/mantis/" target="_blank" rel="noopener" data-i18n="settings_page"></a>
    </div>

    <label class="option">
      <span>
        <b data-i18n="settings_updatesLibreWolf"></b>
        <span class="hint" data-i18n="settings_updatesLibreWolfHint"></span>
      </span>
      <input type="checkbox" class="switch" data-store="devUpdateCheck">
    </label>
  </section>

  <section id="vpn">
    <h2>VPN</h2>
    <div class="option">
      <span><b>WireGuard VPN</b>
        <span class="hint" data-i18n="settings_vpnHint"></span></span>
      <button id="open-vpn" type="button" data-i18n="common_open"></button>
    </div>

    <label class="option">
      <span>
        <b>Kill switch</b>
        <span class="hint" data-i18n="settings_killSwitchHint"></span>
      </span>
      <input type="checkbox" class="switch" data-store="vpnKillSwitch">
    </label>

    <label class="option">
      <span>
        <b data-i18n="settings_routing"></b>
        <span class="hint" data-i18n="settings_routingHint"></span>
      </span>
      <select data-routing="mode">
        <option value="all" data-i18n="settings_routingAll"></option>
        <option value="only" data-i18n="settings_routingOnly"></option>
        <option value="except" data-i18n="settings_routingExcept"></option>
      </select>
    </label>

    <div class="option column" data-routing-detail>
      <label for="routing-sites">
        <b data-i18n="settings_routingSites"></b>
        <span class="hint" data-i18n-html="settings_routingSitesHint"></span>
      </label>
      <textarea id="routing-sites" rows="4" spellcheck="false"></textarea>
    </div>

    <div class="option column" data-routing-detail>
      <span>
        <b data-i18n="settings_routingContainers"></b>
        <span class="hint" data-i18n="settings_routingContainersHint"></span>
      </span>
      <div id="routing-containers" class="checklist"></div>
    </div>
  </section>

  <section id="sync">
    <h2 data-i18n="settings_sync"></h2>
    <label class="option">
      <span>
        <b data-i18n="settings_syncEnabled"></b>
        <span class="hint" data-i18n-html="settings_syncHint"></span>
      </span>
      <input type="checkbox" class="switch" data-local="syncSettings">
    </label>
  </section>

  <script src="../i18n.js"></script>
  <script src="../version.js"></script>
  <script src="settings.js"></script>
  <script src="mods.js"></script>
</body>
</html>
