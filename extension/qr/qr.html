<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="qr_title"></title>
  <link rel="icon" href="../icons/mantis.svg">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f7f6;
      font: 14px/1.45 system-ui, "Segoe UI", sans-serif; color: #1a2e22; }
    @media (prefers-color-scheme: dark) { body { background: #1c1b22; } }
    .card { display: flex; flex-direction: column; align-items: center; gap: 10px; width: min(340px, calc(100vw - 32px));
      padding: 22px; border-radius: 16px; background: #fff; box-shadow: 0 10px 40px rgb(0 0 0 / 0.2); }
    b { font-size: 16px; font-weight: 600; }
    #code { width: 100%; aspect-ratio: 1; }
    #code svg { display: block; width: 100%; height: 100%; }
    #url { max-width: 100%; overflow: hidden; color: #5b6b61; font-size: 12.5px; white-space: nowrap; text-overflow: ellipsis; }
    #hint { color: #5b6b61; font-size: 12.5px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <b data-i18n="qr_title"></b>
    <div id="code"></div>
    <span id="url"></span>
    <span id="hint"></span>
  </div>
  <script src="../i18n.js"></script>
  <script src="qrcode.js"></script>
  <script src="qr-page.js"></script>
</body>
</html>
