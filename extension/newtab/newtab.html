<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="newtab_title"></title>
  <link rel="icon" href="../icons/mantis.svg">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <button id="settings" type="button" data-i18n-title="settings_title" data-i18n-aria-label="settings_title">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
    </svg>
  </button>

  <main>
    <img class="logo" src="../icons/mantis.svg" alt="" width="64" height="64">

    <div id="clock" hidden>
      <div id="time"></div>
      <div id="date"></div>
    </div>

    <form id="search" autocomplete="off">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input id="query" type="text" data-i18n-placeholder="newtab_search"
             data-i18n-aria-label="newtab_search" autofocus
             role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions">
      <ul id="suggestions" role="listbox" hidden></ul>
    </form>

    <nav id="sites" data-i18n-aria-label="newtab_topSites"></nav>
  </main>

  <a id="update" href="https://moneyas.cz/mantis/" hidden></a>

  <script src="../i18n.js"></script>
  <script src="../version.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
