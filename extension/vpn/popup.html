<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>VPN</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/mantis.svg" alt="" width="22" height="22">
    <h1>VPN</h1>
    <span id="endpoint"></span>
  </header>

  <!-- Pomocník není zaregistrovaný -->
  <section id="no-host" hidden>
    <p data-i18n="vpn_noHost"></p>
    <p class="hint" data-i18n-html="vpn_noHostHint"></p>
    <div id="unblock" class="row" hidden>
      <p class="hint" data-i18n="vpn_unblockHint"></p>
      <button id="unblock-btn" type="button" class="primary" data-i18n="vpn_turnOff"></button>
    </div>
  </section>

  <!-- Přidání / změna profilu -->
  <section id="profile" hidden>
    <p data-i18n-html="vpn_profileIntro"></p>
    <p class="hint" data-i18n="vpn_onlyWireguard"></p>
    <textarea id="conf" spellcheck="false" data-i18n-placeholder="vpn_confPlaceholder"></textarea>
    <input id="file" type="file" accept=".conf,text/plain" hidden>
    <div class="row">
      <button id="load" type="button" class="link" data-i18n="vpn_loadFile"></button>
      <button id="cancel" type="button" class="link" hidden data-i18n="common_back"></button>
      <button id="save" type="button" class="primary" data-i18n="vpn_saveConnect"></button>
    </div>
    <p class="hint" data-i18n-html="vpn_storedHint"></p>
  </section>

  <!-- Zapnutí / vypnutí -->
  <section id="main" hidden>
    <label class="switch">
      <input id="toggle" type="checkbox">
      <span class="track"><span class="thumb"></span></span>
      <span id="toggle-label" data-i18n="common_off"></span>
    </label>
    <p id="state" class="hint"></p>
    <div class="row">
      <button id="change" type="button" class="link" data-i18n="vpn_changeProfile"></button>
      <button id="routing" type="button" class="link" data-i18n="vpn_routingLink"></button>
      <button id="remove" type="button" class="link danger" data-i18n="vpn_removeProfile"></button>
    </div>
  </section>

  <p id="error" role="alert" hidden></p>

  <script src="../i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
