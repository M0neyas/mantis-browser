<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="vpnBlocked_title"></title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <main>
    <img src="../icons/vpn-warn.svg" alt="" width="48" height="48">
    <h1 data-i18n="vpnBlocked_title"></h1>
    <p data-i18n="vpnBlocked_text"></p>
    <p class="url" id="url"></p>
    <div class="buttons">
      <button type="button" id="off" data-i18n="vpnBlocked_off"></button>
      <button type="button" id="retry" class="secondary" data-i18n="vpnBlocked_retry"></button>
    </div>
    <p class="hint" id="status" role="status"></p>
    <p class="hint" data-i18n="vpnBlocked_hint"></p>
  </main>
  <script src="../i18n.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
