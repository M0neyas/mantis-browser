<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="welcome_title"></title>
  <link rel="icon" href="../icons/mantis.svg">
  <link rel="stylesheet" href="../settings/settings.css">
  <link rel="stylesheet" href="welcome.css">
</head>
<body>
  <header>
    <img src="../icons/mantis.svg" alt="" width="56" height="56">
    <div>
      <h1 data-i18n="welcome_title"></h1>
      <p class="hint" data-i18n-html="welcome_intro"></p>
    </div>
  </header>

  <section>
    <h2 data-i18n="welcome_working"></h2>
    <div class="option">
      <span>
        <b data-i18n="welcome_adblock"></b>
        <span class="hint" data-i18n="welcome_adblockHint"></span>
      </span>
      <span class="badge" data-i18n="common_on"></span>
    </div>
  </section>

  <section>
    <h2 data-i18n="settings_doh"></h2>
    <label class="option">
      <span>
        <b data-i18n="welcome_doh"></b>
        <span class="hint" data-i18n="welcome_dohHint"></span>
      </span>
      <input id="doh-auto" type="checkbox" class="switch">
    </label>
  </section>

  <section>
    <h2 data-i18n="settings_recommended"></h2>
    <p class="hint lead" data-i18n="welcome_addonsHint"></p>
    <div id="addons"></div>
  </section>

  <p class="hint note" data-i18n-html="welcome_footer"></p>

  <script src="../i18n.js"></script>
  <script src="welcome.js"></script>
</body>
</html>
