// Mantis Browser – výchozí nastavení nad LibreWolfem.
//
// Při buildu se připojí na konec librewolf.cfg, takže přepíše jeho hodnoty.
// Pro vyzkoušení v obyčejném LibreWolfu stačí zkopírovat tento soubor jako
//   %USERPROFILE%\.librewolf\librewolf.overrides.cfg
// a restartovat prohlížeč.
//
// defaultPref = výchozí hodnota, uživatel ji může změnit v nastavení / about:config.

// --- Fingerprinting: bez vynuceného světlého režimu a UTC času -------------
// resistFingerprinting (RFP) nahrazujeme mírnější ochranou Firefoxu (FPP),
// která nerozbíjí tmavý režim webů, časové pásmo ani velikost okna.
defaultPref("privacy.resistFingerprinting", false);
defaultPref("privacy.resistFingerprinting.letterboxing", false);
defaultPref("privacy.fingerprintingProtection", true);

// Weby smí použít tmavý režim podle systému / tématu prohlížeče
defaultPref("layout.css.prefers-color-scheme.content-override", 2);

// --- WebGL: mapy a 3D weby (vypnout jde v Nastavení Mantis → Zabezpečení) ---
defaultPref("webgl.disabled", false);
// LibreWolf navíc blokuje WebGL na každém webu, dokud ho uživatel nepovolí,
// a dotaz schovává (librewolf.webgl.prompt.hide) → WebGL potichu nejde nikde.
// Mapy pak nemají 3D a přehrávač Netflixu skončí hned na E100. Otisk WebGL
// dál zkresluje ochrana FPP.
defaultPref("librewolf.webgl.prompt", false);

// --- VPN kill switch --------------------------------------------------------
// Firefox při nedostupné proxy pouští „konzervativní“ (systémové) požadavky
// napřímo. Se zapnutou VPN (proxy z rozšíření Mantis) nesmí nic obejít tunel.
defaultPref("network.proxy.failover_direct", false);

// --- Při zavření mazat jen cache --------------------------------------------
// Cookies a přihlášení zůstávají. Sledování napříč weby brání Total Cookie
// Protection (cookies třetích stran izolované pro každý web zvlášť).
defaultPref("privacy.sanitize.sanitizeOnShutdown", true);
// novější názvy (Firefox 128+)
defaultPref("privacy.clearOnShutdown_v2.cookiesAndStorage", false);
defaultPref("privacy.clearOnShutdown_v2.cache", true);
defaultPref("privacy.clearOnShutdown_v2.historyFormDataAndDownloads", false);
defaultPref("privacy.clearOnShutdown_v2.browsingHistoryAndDownloads", false);
defaultPref("privacy.clearOnShutdown_v2.siteSettings", false);
// starší názvy (pro jistotu)
defaultPref("privacy.clearOnShutdown.cookies", false);
defaultPref("privacy.clearOnShutdown.offlineApps", false);
defaultPref("privacy.clearOnShutdown.cache", true);
defaultPref("privacy.clearOnShutdown.history", false);
defaultPref("privacy.clearOnShutdown.downloads", false);
defaultPref("privacy.clearOnShutdown.formdata", false);
defaultPref("privacy.clearOnShutdown.sessions", false);

// --- Po spuštění obnovit karty z minula --------------------------------------
defaultPref("browser.startup.page", 3);

// --- Synchronizace mezi počítači (Firefox Sync, šifrováno end-to-end) ------
// Přihlášení: Nastavení → Synchronizace. Hesla řeší Bitwarden.
defaultPref("identity.fxaccounts.enabled", true);

// --- DRM: Netflix, Spotify, Disney+… ---------------------------------------
// LibreWolf DRM vypíná a zakazuje i stažení modulu Widevine. Zapnout je
// potřeba i policy EncryptedMediaExtensions (policies.json), jinak ji přebije.
// Netflix na Windows přesto nejde: licenční server vyžaduje Widevine VMP
// (podpisy *.sig u binárek, které má jen Mozilla), bez nich odhlásí
// („User must login again“ / „Invalid device state for renewal“). Spotify aj.
// s nižší úrovní ochrany fungovat mohou.
defaultPref("media.eme.enabled", true);
defaultPref("media.gmp-widevinecdm.enabled", true);
defaultPref("media.gmp-widevinecdm.visible", true);
defaultPref("media.gmp-manager.updateEnabled", true);   // stažení Widevine
defaultPref("media.eme.require-app-approval", false);   // bez dotazu při každém přehrání

// --- Video a rolování (přepínače v Nastavení Mantis) -----------------------
// Obraz v obraze, když od videa přepnete na jinou kartu
defaultPref("media.videocontrols.picture-in-picture.enable-when-switching-tabs.enabled", true);
// Automatické přehrávání: blokovat jen se zvukem (LibreWolf blokuje vše = 5)
defaultPref("media.autoplay.default", 1);
// Plynulé rolování (fyzikální model, měkčí než výchozí Firefox)
defaultPref("general.smoothScroll.msdPhysics.enabled", true);
defaultPref("general.smoothScroll.msdPhysics.continuousMotionMaxDeltaMS", 12);
defaultPref("general.smoothScroll.msdPhysics.motionBeginSpringConstant", 600);
defaultPref("general.smoothScroll.msdPhysics.regularSpringConstant", 650);
defaultPref("general.smoothScroll.msdPhysics.slowdownMinDeltaMS", 25);
defaultPref("general.smoothScroll.msdPhysics.slowdownSpringConstant", 250);

// --- Odkazy, které LibreWolf směruje na svůj web ---------------------------
// Nápověda k DRM a stránka pro ruční aktualizaci (okno O aplikaci) → Mozilla / Mantis
defaultPref("librewolf.eme.warning.infoURL", "https://support.mozilla.org/kb/enable-drm");
defaultPref("app.update.url.manual", "https://moneyas.cz/mantis/");
defaultPref("app.update.url.details", "https://github.com/M0neyas/mantis-browser");
// Nápověda („Zjistit více“, Nastavení → Podpora → Získat pomoc): adresa + název
// stránky, LibreWolf ji má na support.librewolf.net → nápověda Mozilly (česky)
defaultPref("app.support.baseURL", "https://support.mozilla.org/1/firefox/%VERSION%/%OS%/%LOCALE%/");
// Poznámky k vydání (O aplikaci, Nastavení → Aktualizace) – LibreWolf odkazuje na svá vydání
defaultPref("app.releaseNotesURL", "https://moneyas.cz/mantis/");
defaultPref("app.releaseNotesURL.aboutDialog", "https://moneyas.cz/mantis/");
defaultPref("app.releaseNotesURL.prompt", "https://moneyas.cz/mantis/");

// --- Kontrola pravopisu česky (slovník se instaluje přes policies.json) ----
defaultPref("spellchecker.dictionary", "cs");

// --- Cookie lišty -----------------------------------------------------------
// Firefox 156 vestavěné odmítání cookie lišt už nemá (služba cookiebanners
// byla odstraněna) – lišty skrývají filtry uBlock Origin (policies.json).

// --- Vzhled ---------------------------------------------------------------
// Lišta záložek vždy viditelná (malá, pod adresním řádkem)
defaultPref("browser.toolbars.bookmarks.visibility", "always");

// Výchozí rozložení lišt (viz theme/README.md):
//   1. řádek: ← → ⟳ | adresa | ☰   karty +
//   2. řádek: záložky … stahování, uBlock, Bitwarden, kontejnery, TTV LOL PRO, VPN
// currentVersion musí odpovídat kVersion v CustomizableUI.sys.mjs (Firefox 156 = 26),
// jinak Firefox rozložení „migruje“. Uživatelské úpravy mají přednost.
// Nově připnutá rozšíření jdou do 2. řádku (úprava v prepare-source.sh).
defaultPref("browser.uiCustomization.state", JSON.stringify({
  placements: {
    "widget-overflow-fixed-list": [],
    "unified-extensions-area": [],
    "nav-bar": ["back-button", "forward-button", "stop-reload-button",
                "vertical-spacer", "urlbar-container", "unified-extensions-button"],
    "toolbar-menubar": ["menubar-items"],
    "TabsToolbar": ["tabbrowser-tabs", "new-tab-button", "alltabs-button"],
    "vertical-tabs": [],
    "PersonalToolbar": ["personal-bookmarks", "downloads-button",
                        "ublock0_raymondhill_net-browser-action",
                        "_446900e4-71c2-419f-a6a7-df9c091e268b_-browser-action",
                        "_testpilot-containers-browser-action",
                        "_76ef94a4-e3d0-4c6f-961a-d38a429a332b_-browser-action",
                        "mantis_mantis_browser-browser-action"]
  },
  seen: ["ublock0_raymondhill_net-browser-action",
         "_446900e4-71c2-419f-a6a7-df9c091e268b_-browser-action",
         "_testpilot-containers-browser-action",
         "_76ef94a4-e3d0-4c6f-961a-d38a429a332b_-browser-action",
         "mantis_mantis_browser-browser-action"],
  dirtyAreaCache: [],
  currentVersion: 26,
  newElementCount: 0
}));
// Prototyp vzhledu: načítání theme/userChrome.css z profilu.
// Až vzhled zapečeme do buildu jako patch, tohle zmizí.
// POZOR: v librewolf.overrides.cfg nefunguje – ten se načítá až po startu,
// kdežto tahle hodnota se čte při startu. Pro test v obyčejném LibreWolfu
// ji nastavit přes user.js v profilu (viz theme/README.md). Ve vlastním
// buildu (připojeno k librewolf.cfg, které se čte při startu) funguje.
defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
